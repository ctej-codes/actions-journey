name: repo checks

on: push

jobs:
  full-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Print runner kernel details
        run: uname -a
      - name: List files
        working-directory: actions-journey 
        run: |
          ls
          find . -type f
          echo "File count: $(find . -type f | wc -l)"          
        

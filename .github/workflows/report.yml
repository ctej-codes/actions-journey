name: Artifact Class

on: push

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Write a TXT file
        run: echo "This is a test report" > report.txt

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt
          retention-days: 5
